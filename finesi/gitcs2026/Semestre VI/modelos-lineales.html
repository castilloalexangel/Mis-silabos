<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modelos Lineales — Sílabo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e28;
    --border: rgba(255,255,255,0.07);
    --gold: #c9a84c;
    --gold2: #e8c97a;
    --text: #e8e8e8;
    --muted: #7a7f8e;
    --accent: #2a3045;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .topbar-mini {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 12px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topbar-mini .logo {
    width: 30px; height: 30px;
    background: var(--gold);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; color: #0d0f14;
  }
  .topbar-mini .uni { font-size: 12px; color: var(--muted); }
  .topbar-mini .uni strong { color: var(--text); font-weight: 500; }

  .card {
    max-width: 420px;
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
    text-align: center;
  }
  .pdf-icon {
    width: 52px; height: 52px;
    margin: 0 auto 18px;
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
    font-weight: 500;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .meta::before {
    content: '';
    width: 5px; height: 5px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0.6;
  }
  a.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--gold2);
    text-decoration: none;
    border-radius: 8px;
    padding: 12px 0;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s;
  }
  a.btn:hover { background: rgba(201,168,76,0.2); }
  a.btn svg { width: 15px; height: 15px; }
  a.back {
    display: block;
    margin-top: 20px;
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
  }
  a.back:hover { color: var(--gold2); }
</style>
</head>
<body>
  <div class="topbar-mini">
    <div class="logo">UNA</div>
    <div class="uni"><strong>Universidad Nacional del Altiplano</strong> · Facultad de Ingeniería Estadística e Informática</div>
  </div>
  <div class="card">
    <div class="pdf-icon">📈</div>
    <div class="eyebrow">Semestre VI · 2026-I</div>
    <h1>Modelos Lineales</h1>
    <div class="meta">Modelos Discretos · Semestre VI</div>
    <a class="btn" href="modelos%20lineales.pdf" download>
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 11l5 5 5-5M12 4v12"/></svg>
      Descargar sílabo
    </a>
    <a class="back" href="../../../index.html">← Volver al portal</a>
  </div>
</body>
</html>
