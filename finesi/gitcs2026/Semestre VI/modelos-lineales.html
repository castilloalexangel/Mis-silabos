<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modelos Lineales — Sílabo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e28;
    --border: rgba(255,255,255,0.07);
    --gold: #c9a84c;
    --gold2: #e8c97a;
    --text: #e8e8e8;
    --muted: #7a7f8e;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  .topbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .topbar .logo {
    width: 32px; height: 32px;
    background: var(--gold);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; color: #0d0f14;
    flex-shrink: 0;
  }
  .topbar .uni { font-size: 12px; color: var(--muted); }
  .topbar .uni strong { color: var(--text); font-weight: 500; }
  .topbar .sep { color: var(--border); }

  .course-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .course-bar .icon {
    width: 34px; height: 34px;
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .course-info { flex: 1; min-width: 180px; }
  .course-eyebrow {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 500;
    margin-bottom: 2px;
  }
  .course-title { font-size: 15px; font-weight: 600; }
  .course-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .actions { display: flex; gap: 10px; align-items: center; }
  a.btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--gold2);
    text-decoration: none;
    border-radius: 7px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  a.btn:hover { background: rgba(201,168,76,0.2); }
  a.btn svg { width: 14px; height: 14px; }
  a.back {
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
    white-space: nowrap;
  }
  a.back:hover { color: var(--gold2); }

  .viewer-wrap {
    flex: 1;
    padding: 16px;
    display: flex;
  }
  .viewer-frame {
    flex: 1;
    background: #1c1c1c;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .viewer-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  .fallback {
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .fallback a { color: var(--gold2); }

  @media (max-width: 640px) {
    .viewer-wrap { padding: 10px; }
    .course-title { font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo">UNA</div>
    <div class="uni"><strong>Universidad Nacional del Altiplano</strong> <span class="sep">·</span> Facultad de Ingeniería Estadística e Informática</div>
  </div>

  <div class="course-bar">
    <div class="icon">📈</div>
    <div class="course-info">
      <div class="course-eyebrow">Semestre VI · 2026-I</div>
      <div class="course-title">Modelos Lineales</div>
      <div class="course-meta">Modelos Discretos · Semestre VI</div>
    </div>
    <div class="actions">
      <a class="back" href="../../../index.html">← Volver al portal</a>
      <a class="btn" href="modelos%20lineales.pdf" download>
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 11l5 5 5-5M12 4v12"/></svg>
        Descargar
      </a>
    </div>
  </div>

  <div class="viewer-wrap">
    <div class="viewer-frame">
      <iframe src="modelos%20lineales.pdf" title="Sílabo Modelos Lineales">
        <div class="fallback">
          Tu navegador no puede mostrar el PDF aquí.
          <a href="modelos%20lineales.pdf">Descárgalo directamente</a>.
        </div>
      </iframe>
    </div>
  </div>
</body>
</html>
